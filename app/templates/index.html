{% extends "base.html" %}
{% block title_suffix %} — Products{% endblock %}
{% block content %}
<h1 class="mb-4">ShopLite Products</h1>
<div class="row row-cols-1 row-cols-md-3 g-4">
  {% for p in products %}
  <div class="col">
    <div class="card h-100">
      <div class="card-body">
        <h5 class="card-title">{{ p.name }}</h5>
        <p class="card-text text-muted">{{ p.description }}</p>
        <p class="card-text fw-bold">${{ "%.2f"|format(p.price) }}</p>
      </div>
    </div>
  </div>
  {% endfor %}
</div>
{% endblock %}
