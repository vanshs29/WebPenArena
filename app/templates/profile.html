{% extends "base.html" %}
{% block title_suffix %} — Profile{% endblock %}
{% block content %}
<h2>Your Profile</h2>
<dl class="row mt-3">
  <dt class="col-sm-3">Email</dt>
  <dd class="col-sm-9">{{ payload.email }}</dd>
  <dt class="col-sm-3">Role</dt>
  <dd class="col-sm-9">{{ payload.role }}</dd>
</dl>
<a href="/logout" class="btn btn-secondary">Logout</a>
{% endblock %}
