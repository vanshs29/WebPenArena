<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ShopLite{% block title_suffix %}{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand fw-bold" href="/">ShopLite</a>
      <div class="d-flex gap-2">
        <a class="btn btn-outline-light btn-sm" href="/login">Login</a>
        <a class="btn btn-outline-light btn-sm" href="/register">Register</a>
        <a class="btn btn-outline-secondary btn-sm" href="/profile">Profile</a>
        <a class="btn btn-outline-secondary btn-sm" href="/admin">Admin</a>
      </div>
    </div>
  </nav>
  <div class="container mt-4">
    {% block content %}{% endblock %}
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
