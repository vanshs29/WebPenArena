<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LinkPeek</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<nav class="navbar navbar-dark bg-primary mb-4">
  <div class="container">
    <span class="navbar-brand fw-bold">LinkPeek</span>
    <div>
      <a href="/" class="btn btn-outline-light btn-sm me-1">Home</a>
      <a href="/history" class="btn btn-outline-light btn-sm me-1">History</a>
      <a href="/about" class="btn btn-outline-light btn-sm">About</a>
    </div>
  </div>
</nav>
<div class="container">
  <div class="row">
    <div class="col-md-6 offset-md-3">
      <div class="card">
        <div class="card-header">Preview a URL</div>
        <div class="card-body">
          <p class="text-muted small">
            Paste a URL below. LinkPeek fetches it server-side and shows you the
            HTTP status and a content snippet.
          </p>
          <div class="mb-2">
            <input id="url-input" placeholder="https://example.com" class="form-control form-control-sm">
          </div>
          <button id="preview-btn" class="btn btn-primary btn-sm w-100">Preview</button>
          <pre id="result" class="mt-3 small bg-light p-2 border rounded" style="white-space: pre-wrap;"></pre>
        </div>
      </div>
    </div>
  </div>
</div>
<script>
document.getElementById('preview-btn').addEventListener('click', async () => {
  const url = document.getElementById('url-input').value;
  const resp = await fetch('/preview', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({url: url})
  });
  const data = await resp.json();
  document.getElementById('result').textContent = JSON.stringify(data, null, 2);
});
</script>
</body>
</html>
