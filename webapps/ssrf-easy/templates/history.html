<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LinkPeek — History</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<nav class="navbar navbar-dark bg-primary mb-4">
  <div class="container">
    <span class="navbar-brand fw-bold">LinkPeek</span>
    <a href="/" class="btn btn-outline-light btn-sm">Home</a>
  </div>
</nav>
<div class="container">
  <h2>Preview History</h2>
  <table class="table table-bordered table-sm">
    <thead class="table-dark">
      <tr><th>#</th><th>URL</th><th>Status</th><th>Snippet</th></tr>
    </thead>
    <tbody>
      {{range .Rows}}
      <tr>
        <td>{{.ID}}</td>
        <td>{{.URL}}</td>
        <td>{{.StatusCode}}</td>
        <td>{{.Snippet}}</td>
      </tr>
      {{else}}
      <tr><td colspan="4" class="text-muted">No previews yet.</td></tr>
      {{end}}
    </tbody>
  </table>
</div>
</body>
</html>
