{% extends "base.html" %}
{% block title_suffix %} — Upload{% endblock %}
{% block content %}
  <h2 class="mb-4">Upload a photo</h2>
  {% if error %}
    <div class="alert alert-danger">{{ error }}</div>
  {% endif %}
  <form method="post" action="/upload" enctype="multipart/form-data" class="col-md-6">
    <div class="mb-3">
      <label class="form-label" for="photo">Photo</label>
      <input class="form-control" type="file" id="photo" name="photo" accept="image/*" required>
    </div>
    <button type="submit" class="btn btn-primary">Upload</button>
  </form>
{% endblock %}
