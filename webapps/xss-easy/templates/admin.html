<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PinBoard — Admin</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<nav class="navbar navbar-dark bg-danger mb-4">
  <div class="container">
    <span class="navbar-brand fw-bold">PinBoard Admin</span>
    <a href="/" class="btn btn-outline-light btn-sm">Back to Home</a>
  </div>
</nav>
<div class="container">
  <h2>All Messages <span class="badge bg-secondary">{{len .Messages}}</span></h2>
  <table class="table table-bordered table-sm">
    <thead class="table-dark">
      <tr><th>#</th><th>Author</th><th>Content</th></tr>
    </thead>
    <tbody>
      {{range .Messages}}
      <tr>
        <td>{{.ID}}</td>
        <td>{{.Author}}</td>
        <td class="message-body">{{.Content}}</td>
      </tr>
      {{else}}
      <tr><td colspan="3" class="text-muted">No messages.</td></tr>
      {{end}}
    </tbody>
  </table>
</div>
</body>
</html>
