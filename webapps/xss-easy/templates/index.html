<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PinBoard</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<nav class="navbar navbar-dark bg-primary mb-4">
  <div class="container">
    <span class="navbar-brand fw-bold">PinBoard</span>
    <div>
      <a href="/" class="btn btn-outline-light btn-sm me-1">Home</a>
      <a href="/search" class="btn btn-outline-light btn-sm me-1">Search</a>
      <a href="/admin" class="btn btn-outline-light btn-sm">Admin</a>
    </div>
  </div>
</nav>
<div class="container">
  <div class="row">
    <div class="col-md-8">
      <h2>Team Updates</h2>
      {{range .Messages}}
      <div class="card mb-3">
        <div class="card-body">
          <h6 class="card-subtitle mb-2 text-muted">{{.Author}}</h6>
          <p class="message-body mb-0">{{.Content}}</p>
        </div>
      </div>
      {{else}}
      <p class="text-muted">No messages yet. Be the first to post!</p>
      {{end}}
    </div>
    <div class="col-md-4">
      <div class="card">
        <div class="card-header">Post an Update</div>
        <div class="card-body">
          <form method="post" action="/message">
            <div class="mb-2">
              <input name="author" placeholder="Your name (optional)" class="form-control form-control-sm">
            </div>
            <div class="mb-2">
              <textarea name="content" placeholder="What's the update?" class="form-control form-control-sm" rows="3" required></textarea>
            </div>
            <button type="submit" class="btn btn-primary btn-sm w-100">Post</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
