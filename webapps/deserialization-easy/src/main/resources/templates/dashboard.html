<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>SessionStore — Dashboard</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark mb-4">
  <div class="container d-flex justify-content-between">
    <span class="navbar-brand fw-bold">SessionStore</span>
    <a href="/logout" class="btn btn-outline-light btn-sm">Log out</a>
  </div>
</nav>
<div class="container" style="max-width: 560px;">
  <div class="card shadow-sm">
    <div class="card-body">
      <h4 class="card-title mb-3">Dashboard</h4>

      <div th:if="${sessionValid}">
        <p>Welcome, <strong th:text="${username}">username</strong>.</p>
        <ul class="list-unstyled text-muted small">
          <li>Role: <span th:text="${role}">role</span></li>
          <li>Theme: <span th:text="${theme}">theme</span></li>
        </ul>
      </div>

      <div th:unless="${sessionValid}" class="alert alert-warning">
        Your session could not be read. Please <a href="/">sign in</a> again.
      </div>

      <div th:if="${exploited}" class="alert alert-success mt-3">
        <strong th:text="${flag}">FLAG</strong>
      </div>
    </div>
  </div>
</div>
</body>
</html>
