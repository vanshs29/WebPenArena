# Real phpMyAdmin, unmodified, served on the same vhost/port as WordPress via
# a plain Alias -- no reverse proxy, no changes to phpMyAdmin's own source.
# See PLAN.md 2/6 for why this is bundled instead of exposing MySQL directly.
Alias /phpmyadmin /var/www/phpmyadmin

<Directory /var/www/phpmyadmin>
    Options FollowSymLinks
    DirectoryIndex index.php
    AllowOverride None
    Require all granted
</Directory>
