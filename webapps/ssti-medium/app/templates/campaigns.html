{% extends "base.html" %}
{% block title_suffix %} — Campaigns{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h2 class="mb-0">Your Campaigns</h2>
  <a class="btn btn-primary" href="/campaigns/new">New Campaign</a>
</div>
{% if campaigns %}
<table class="table table-striped">
  <thead><tr><th>Subject</th><th>Body</th></tr></thead>
  <tbody>
    {% for c in campaigns %}
    <tr>
      <td>{{ c.subject }}</td>
      <td><pre class="mb-0">{{ c.body }}</pre></td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% else %}
<p class="text-muted">No campaigns yet.</p>
{% endif %}
{% endblock %}
