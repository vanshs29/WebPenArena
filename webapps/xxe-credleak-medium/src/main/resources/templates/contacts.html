<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Rosterly — My Contacts</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark mb-4">
  <div class="container">
    <a class="navbar-brand fw-bold text-decoration-none" href="/">Rosterly</a>
    <div>
      <a class="btn btn-outline-light btn-sm me-2" href="/directory">Directory</a>
      <a class="btn btn-outline-light btn-sm me-2" href="/contacts">My Contacts</a>
      <a class="btn btn-outline-light btn-sm" href="/contacts/import">Import</a>
    </div>
  </div>
</nav>
<div class="container">
  <h4 class="mb-3">My Contacts</h4>
  <p th:if="${contacts.isEmpty()}" class="text-muted">No contacts yet. <a href="/contacts/import">Import some</a>.</p>
  <div class="card mb-3" th:each="contact : ${contacts}">
    <div class="card-body">
      <pre class="mb-1" th:text="${contact.name}">name</pre>
      <p class="text-muted small mb-0" th:text="${contact.email}">email</p>
    </div>
  </div>
</div>
</body>
</html>
