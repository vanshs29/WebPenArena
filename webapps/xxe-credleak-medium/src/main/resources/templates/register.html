<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Rosterly — Register</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark mb-4">
  <div class="container">
    <a class="navbar-brand fw-bold text-decoration-none" href="/">Rosterly</a>
  </div>
</nav>
<div class="container" style="max-width: 420px;">
  <div class="card shadow-sm">
    <div class="card-body">
      <h4 class="card-title mb-3">Create an account</h4>
      <form method="post" action="/register">
        <div class="mb-3">
          <label for="username" class="form-label">Username</label>
          <input type="text" class="form-control" id="username" name="username" required>
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input type="password" class="form-control" id="password" name="password" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Register</button>
      </form>
      <p class="text-muted small mt-3 mb-0">Already have an account? <a href="/login">Sign in</a></p>
    </div>
  </div>
</div>
</body>
</html>
