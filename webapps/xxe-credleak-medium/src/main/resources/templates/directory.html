<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Rosterly — Directory</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark mb-4">
  <div class="container">
    <a class="navbar-brand fw-bold text-decoration-none" href="/">Rosterly</a>
    <div>
      <a class="btn btn-outline-light btn-sm me-2" href="/directory">Directory</a>
      <a class="btn btn-outline-light btn-sm" href="/contacts">My Contacts</a>
    </div>
  </div>
</nav>
<div class="container">
  <h4 class="mb-3">Company Directory</h4>
  <table class="table table-bordered bg-white">
    <thead class="table-light">
      <tr><th>Name</th><th>Work Email</th></tr>
    </thead>
    <tbody>
      <tr th:each="user : ${users}">
        <td th:text="${user.username}">username</td>
        <td th:text="${user.workEmail}">email</td>
      </tr>
    </tbody>
  </table>
</div>
</body>
</html>
