<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Rosterly — Import Contacts</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark mb-4">
  <div class="container">
    <a class="navbar-brand fw-bold text-decoration-none" href="/">Rosterly</a>
    <div>
      <a class="btn btn-outline-light btn-sm me-2" href="/directory">Directory</a>
      <a class="btn btn-outline-light btn-sm" href="/contacts">My Contacts</a>
    </div>
  </div>
</nav>
<div class="container" style="max-width: 480px;">
  <div class="card shadow-sm">
    <div class="card-body">
      <h4 class="card-title mb-3">Import Contacts</h4>
      <p class="text-muted small">Upload an XML file of contacts to add to your personal list.</p>
      <form method="post" action="/contacts/import" enctype="multipart/form-data">
        <div class="mb-3">
          <input type="file" class="form-control" name="file" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Import</button>
      </form>
    </div>
  </div>
</div>
</body>
</html>
