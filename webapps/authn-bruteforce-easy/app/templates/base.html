<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alderworks{% block title_suffix %}{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand fw-bold" href="/">Alderworks</a>
      <div class="d-flex gap-2">
        <a class="btn btn-outline-light btn-sm" href="/">Home</a>
        <a class="btn btn-outline-light btn-sm" href="/about">About</a>
        <a class="btn btn-outline-light btn-sm" href="/team">Team</a>
        <a class="btn btn-outline-light btn-sm" href="/contact">Contact</a>
      </div>
    </div>
  </nav>
  <div class="container mt-4 mb-5">
    {% block content %}{% endblock %}
  </div>
  <footer class="container text-muted small mb-4">
    &copy; Alderworks Studio
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
