{% extends 'base.html' %}
{% block title_suffix %} — Team{% endblock %}
{% block content %}
<h2 class="mb-4">Our Team</h2>
<div class="row g-4">
  {% for member in team %}
  <div class="col-md-6">
    <div class="card h-100">
      <div class="card-body">
        <h5 class="card-title">{{ member.name }}</h5>
        <h6 class="card-subtitle mb-2 text-muted">{{ member.role }}</h6>
        <p class="card-text">{{ member.bio }}</p>
      </div>
    </div>
  </div>
  {% endfor %}
</div>
{% endblock %}
